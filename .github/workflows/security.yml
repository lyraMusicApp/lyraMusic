name: Security & Code Safety Audit

on:
  push:
    branches: [ main, master, lyra ]
  pull_request:
    branches: [ main, master, lyra ]
  schedule:
    - cron: '0 0 * * 1' # Every Monday at midnight

concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-scan:
    name: Security & Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Executable Permissions
        run: chmod +x gradlew

      - name: Run Gradle Lint & Security Checks
        run: ./gradlew lintUniversalRelease --continue || true

      - name: Verify Build Integrity
        run: ./gradlew assembleUniversalDebug

      - name: Check for Exposed Secrets & Keys
        uses: trufflesecurity/trufflehog-actions-scan@v3.63.0
        with:
          extra_args: --only-verified
        continue-on-error: true
