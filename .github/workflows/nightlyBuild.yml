name: Lyra CI - Nightly Build

on:
  schedule:
    - cron: '0 0 * * *' # Every midnight
  workflow_dispatch:

concurrency:
  group: nightly-build-run
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Notify Nightly Build Started (Topic 135)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TOPIC_ID: ${{ secrets.TOPIC_GITHUB_LOGS }}
          REF_NAME: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          SHA: ${{ github.sha }}
        run: |
          python3 -c '
          import os, json, urllib.request, html
          bot = os.environ.get("TELEGRAM_BOT_TOKEN")
          chat = os.environ.get("TELEGRAM_CHAT_ID")
          topic = os.environ.get("TOPIC_ID")
          ref = html.escape(os.environ.get("REF_NAME", "lyra"))
          actor = html.escape(os.environ.get("ACTOR", "cron"))
          sha = os.environ.get("SHA", "")[:7]
          text = f"🌙 <b>Lyra Music Nightly Build Started</b>\n🌿 <b>Branch:</b> <code>{ref}</code>\n👤 <b>Triggered by:</b> @{actor}\n🔖 <b>Commit:</b> <code>{sha}</code>\n\n⏳ <i>Compiling nightly APK...</i>"
          payload = json.dumps({"chat_id": int(chat), "message_thread_id": int(topic), "text": text, "parse_mode": "HTML", "disable_web_page_preview": True}).encode("utf-8")
          req = urllib.request.Request(f"https://api.telegram.org/bot{bot}/sendMessage", data=payload, headers={"Content-Type": "application/json"})
          try:
              urllib.request.urlopen(req, timeout=10)
          except Exception as e:
              print("Notify error:", e)
          ' || true

      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build Nightly APK
        run: ./gradlew assembleDebug

      - name: Locate and Process Nightly APK
        id: find_apk
        run: |
          APK_FILE=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          fi
          echo "Found APK at $APK_FILE"
          FILE_SIZE=$(stat -c%s "$APK_FILE")
          echo "APK File Size: $FILE_SIZE bytes"
          cp "$APK_FILE" lyra-nightly-universal.apk
          echo "apk_path=lyra-nightly-universal.apk" >> $GITHUB_OUTPUT
          echo "apk_size=$FILE_SIZE" >> $GITHUB_OUTPUT

      - name: Publish to GitHub Release (Nightly Tag)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: Lyra Music Nightly Build
          prerelease: true
          files: lyra-nightly-universal.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Upload Nightly APK to Telegram (Topic 154)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TOPIC_ID: ${{ secrets.TOPIC_NIGHTLY_APK }}
          SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          python3 -c '
          import os, json, urllib.request, requests
          bot = os.environ.get("TELEGRAM_BOT_TOKEN")
          chat = os.environ.get("TELEGRAM_CHAT_ID")
          topic = os.environ.get("TOPIC_ID", "154")
          sha = os.environ.get("SHA", "")[:7]
          ref = os.environ.get("REF_NAME", "lyra")
          repo = os.environ.get("REPO", "lyraMusicApp/lyraMusic")
          
          apk_path = "lyra-nightly-universal.apk"
          size_bytes = os.path.getsize(apk_path)
          size_mb = round(size_bytes / (1024 * 1024), 2)
          
          changelog_url = f"https://github.com/{repo}/commits/{ref}"
          github_url = f"https://github.com/{repo}"
          download_url = f"https://github.com/{repo}/releases/download/nightly/lyra-nightly-universal.apk"
          
          reply_markup = {
              "inline_keyboard": [
                  [
                      {"text": "📖 View Full Changelog", "url": changelog_url},
                      {"text": "🔗 View on GitHub", "url": github_url}
                  ],
                  [
                      {"text": "⬇️ Download Nightly APK (Direct)", "url": download_url}
                  ]
              ]
          }
          
          # If file exceeds Telegram limit (50MB) -> Send formatted warning matching Image 3
          if size_mb > 49.5:
              text = f"<b>Lyra Music | Bot</b>  <code>admin</code>\n🛠️ <b>Lyra Music Nightly Build</b>\n\n⚠️ <b>Notice:</b> APK size ({size_mb} MB) exceeds Telegram'\''s 50 MB Bot API upload limit.\nPlease download the APK directly using the buttons below:"
              data = json.dumps({
                  "chat_id": int(chat),
                  "message_thread_id": int(topic),
                  "text": text,
                  "parse_mode": "HTML",
                  "reply_markup": reply_markup
              }).encode("utf-8")
              req = urllib.request.Request(f"https://api.telegram.org/bot{bot}/sendMessage", data=data, headers={"Content-Type": "application/json"})
              urllib.request.urlopen(req)
              print("Sent size notice with buttons to Topic 154")
          else:
              # Upload document with inline buttons
              caption = f"🌙 <b>Lyra Music Nightly APK</b>\n\n🔖 <b>Commit:</b> <code>{sha}</code>\n🌿 <b>Branch:</b> <code>{ref}</code>\n📦 <b>Size:</b> {size_mb} MB"
              with open(apk_path, "rb") as f:
                  res = requests.post(
                      f"https://api.telegram.org/bot{bot}/sendDocument",
                      data={
                          "chat_id": chat,
                          "message_thread_id": topic,
                          "caption": caption,
                          "parse_mode": "HTML",
                          "reply_markup": json.dumps(reply_markup)
                      },
                      files={"document": (f"LyraMusic-nightly-{sha}.apk", f)}
                  )
                  print("Uploaded nightly document to Topic 154:", res.status_code)
          '

      - name: Notify Success (Topic 135)
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TOPIC_ID: ${{ secrets.TOPIC_GITHUB_LOGS }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          SERVER_URL: ${{ github.server_url }}
          REPO: ${{ github.repository }}
        run: |
          python3 -c '
          import os, json, urllib.request
          bot = os.environ.get("TELEGRAM_BOT_TOKEN")
          chat = os.environ.get("TELEGRAM_CHAT_ID")
          topic = os.environ.get("TOPIC_ID")
          sha = os.environ.get("SHA", "")[:7]
          run_id = os.environ.get("RUN_ID", "")
          server = os.environ.get("SERVER_URL", "https://github.com")
          repo = os.environ.get("REPO", "")
          text = f"🎉 <b>Nightly Build Succeeded!</b>\n\n🌙 <b>APK delivered to Topic 154</b>\n🔖 <b>Commit:</b> <code>{sha}</code>\n🔗 <a href=\"{server}/{repo}/actions/runs/{run_id}\">View Workflow Run</a>"
          payload = json.dumps({"chat_id": int(chat), "message_thread_id": int(topic), "text": text, "parse_mode": "HTML", "disable_web_page_preview": True}).encode("utf-8")
          req = urllib.request.Request(f"https://api.telegram.org/bot{bot}/sendMessage", data=payload, headers={"Content-Type": "application/json"})
          try:
              urllib.request.urlopen(req, timeout=10)
          except Exception as e:
              print("Notify error:", e)
          ' || true