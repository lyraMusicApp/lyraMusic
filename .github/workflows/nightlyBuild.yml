name: Nightly APK

on:
  push:
    branches: [lyra]
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-apk
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SIGNING_STORE_FILE: ${{ runner.temp }}/lyra-release.keystore
      SIGNING_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Restore release signing key
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$RELEASE_KEYSTORE_BASE64"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$SIGNING_STORE_FILE"
          test -s "$SIGNING_STORE_FILE"

      - name: Build signed nightly APK
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Verify signed APK
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          "$BUILD_TOOLS/zipalign" -c -P 16 -v 4 "$APK"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          cp "$APK" LyraMusic.apk
          sha256sum LyraMusic.apk > LyraMusic.apk.sha256

      - name: Upload nightly artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LyraMusic-nightly-${{ github.sha }}
          path: |
            LyraMusic.apk
            LyraMusic.apk.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Publish nightly release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: Lyra Music nightly
          body: Automated signed nightly build from ${{ github.sha }}.
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: |
            LyraMusic.apk
            LyraMusic.apk.sha256
