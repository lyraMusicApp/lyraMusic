name: Lyra CI - Release Build

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (e.g. v3.1.0)'
        required: false
        default: 'v3.1.0'
      release_notes:
        description: 'Release Notes summary'
        required: false
        default: 'Official release build'
  push:
    tags:
      - 'v*'

concurrency:
  group: release-build
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Notify Release Started (Topic 135)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TOPIC_ID: ${{ secrets.TOPIC_GITHUB_LOGS }}
          REF_NAME: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
        run: |
          python3 -c '
          import os, json, urllib.request, html
          bot = os.environ.get("TELEGRAM_BOT_TOKEN")
          chat = os.environ.get("TELEGRAM_CHAT_ID")
          topic = os.environ.get("TOPIC_ID")
          ref = html.escape(os.environ.get("REF_NAME", ""))
          actor = html.escape(os.environ.get("ACTOR", ""))
          text = f"🚀 <b>Lyra Music Release Build Started</b>\n🌿 <b>Ref:</b> <code>{ref}</code>\n👤 <b>Triggered by:</b> <a href=\"https://github.com/{actor}\">@{actor}</a>\n⏳ <i>Building official signed release APK...</i>"
          payload = json.dumps({"chat_id": int(chat), "message_thread_id": int(topic), "text": text, "parse_mode": "HTML", "disable_web_page_preview": True}).encode("utf-8")
          req = urllib.request.Request(f"https://api.telegram.org/bot{bot}/sendMessage", data=payload, headers={"Content-Type": "application/json"})
          try:
              urllib.request.urlopen(req, timeout=10)
          except Exception as e:
              print("Notify error:", e)
          ' || true

      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Locate and Process Release APK
        id: find_apk
        run: |
          APK_FILE=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find app/build/outputs/apk -name "*release*.apk" | head -n 1)
          fi
          echo "Found APK at $APK_FILE"
          FILE_SIZE=$(stat -c%s "$APK_FILE")
          echo "APK File Size: $FILE_SIZE bytes"
          cp "$APK_FILE" LyraMusic-release.apk
          echo "apk_path=LyraMusic-release.apk" >> $GITHUB_OUTPUT
          echo "apk_size=$FILE_SIZE" >> $GITHUB_OUTPUT

      - name: Upload Release APK to Telegram (Topic 140)
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          BUILD_DATE=$(date -u +'%Y-%m-%d %H:%M UTC')
          TAG="${{ github.event.inputs.release_tag || github.ref_name }}"
          NOTES="${{ github.event.inputs.release_notes || 'Official Production Release' }}"
          CAPTION="🚀 <b>Lyra Music - Official Release APK</b>%0A%0A🔖 <b>Version:</b> <code>$TAG</code>%0A🌿 <b>Commit:</b> <code>$SHORT_SHA</code>%0A📅 <b>Date:</b> $BUILD_DATE%0A📝 <i>$NOTES</i>%0A%0A✨ <i>Download and install to get the latest features!</i>"
          
          echo "Uploading Release APK to Topic 140..."
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendDocument" \
            -F "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -F "message_thread_id=${{ secrets.TOPIC_RELEASE_APK }}" \
            -F "document=@LyraMusic-release.apk" \
            -F "caption=$CAPTION" \
            -F "parse_mode=HTML"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          name: Lyra Music ${{ github.event.inputs.release_tag || github.ref_name }}
          draft: false
          prerelease: false
          files: LyraMusic-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Notify Success (Topic 135)
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TOPIC_ID: ${{ secrets.TOPIC_GITHUB_LOGS }}
          VERSION: ${{ github.event.inputs.release_tag || github.ref_name }}
          RUN_ID: ${{ github.run_id }}
          SERVER_URL: ${{ github.server_url }}
          REPO: ${{ github.repository }}
        run: |
          python3 -c '
          import os, json, urllib.request, html
          bot = os.environ.get("TELEGRAM_BOT_TOKEN")
          chat = os.environ.get("TELEGRAM_CHAT_ID")
          topic = os.environ.get("TOPIC_ID")
          version = html.escape(os.environ.get("VERSION", ""))
          run_id = os.environ.get("RUN_ID", "")
          server = os.environ.get("SERVER_URL", "https://github.com")
          repo = os.environ.get("REPO", "")
          text = f"🎉 <b>Release Build Complete!</b>\n\n🚀 <b>Release APK published to Topic 140</b>\n🏷️ <b>Version:</b> <code>{version}</code>\n🔗 <a href=\"{server}/{repo}/actions/runs/{run_id}\">View Release Run</a>"
          payload = json.dumps({"chat_id": int(chat), "message_thread_id": int(topic), "text": text, "parse_mode": "HTML", "disable_web_page_preview": True}).encode("utf-8")
          req = urllib.request.Request(f"https://api.telegram.org/bot{bot}/sendMessage", data=payload, headers={"Content-Type": "application/json"})
          try:
              urllib.request.urlopen(req, timeout=10)
          except Exception as e:
              print("Notify error:", e)
          ' || true

      - name: Notify Failure (Topic 135)
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TOPIC_ID: ${{ secrets.TOPIC_GITHUB_LOGS }}
          REF_NAME: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
          SERVER_URL: ${{ github.server_url }}
          REPO: ${{ github.repository }}
        run: |
          python3 -c '
          import os, json, urllib.request, html
          bot = os.environ.get("TELEGRAM_BOT_TOKEN")
          chat = os.environ.get("TELEGRAM_CHAT_ID")
          topic = os.environ.get("TOPIC_ID")
          ref = html.escape(os.environ.get("REF_NAME", ""))
          run_id = os.environ.get("RUN_ID", "")
          server = os.environ.get("SERVER_URL", "https://github.com")
          repo = os.environ.get("REPO", "")
          text = f"❌ <b>Release Build Failed!</b>\n\n🌿 <b>Ref:</b> <code>{ref}</code>\n🔗 <a href=\"{server}/{repo}/actions/runs/{run_id}\">Check Error Logs</a>"
          payload = json.dumps({"chat_id": int(chat), "message_thread_id": int(topic), "text": text, "parse_mode": "HTML", "disable_web_page_preview": True}).encode("utf-8")
          req = urllib.request.Request(f"https://api.telegram.org/bot{bot}/sendMessage", data=payload, headers={"Content-Type": "application/json"})
          try:
              urllib.request.urlopen(req, timeout=10)
          except Exception as e:
              print("Notify error:", e)
          ' || true