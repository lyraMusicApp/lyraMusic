name: Lyra CI - Debug Build

on:
  push:
    branches:
      - lyra
      - master
    paths-ignore:
      - '*.md'
      - 'assets/**'
      - '.gitignore'
  workflow_dispatch:

concurrency:
  group: debug-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Notify Build Started (Topic 135)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TOPIC_ID: ${{ secrets.TOPIC_GITHUB_LOGS }}
          REF_NAME: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          SHA: ${{ github.sha }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          python3 -c '
          import os, json, urllib.request, html
          bot = os.environ.get("TELEGRAM_BOT_TOKEN")
          chat = os.environ.get("TELEGRAM_CHAT_ID")
          topic = os.environ.get("TOPIC_ID")
          ref = html.escape(os.environ.get("REF_NAME", "lyra"))
          actor = html.escape(os.environ.get("ACTOR", "author"))
          sha = os.environ.get("SHA", "")[:7]
          msg = html.escape(os.environ.get("COMMIT_MSG", "Update").strip())
          text = f"🔨 <b>Lyra Music Debug Build Started</b>\n🌿 <b>Branch:</b> <code>{ref}</code>\n👤 <b>Author:</b> <a href=\"https://github.com/{actor}\">@{actor}</a>\n🔖 <b>Commit:</b> <code>{sha}</code>\n📝 <i>{msg}</i>\n\n⏳ <i>Building debug APK...</i>"
          payload = json.dumps({"chat_id": int(chat), "message_thread_id": int(topic), "text": text, "parse_mode": "HTML", "disable_web_page_preview": True}).encode("utf-8")
          req = urllib.request.Request(f"https://api.telegram.org/bot{bot}/sendMessage", data=payload, headers={"Content-Type": "application/json"})
          try:
              urllib.request.urlopen(req, timeout=10)
          except Exception as e:
              print("Notify error:", e)
          ' || true

      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Locate and Process Debug APK
        id: find_apk
        run: |
          APK_FILE=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          fi
          echo "Found APK at $APK_FILE"
          FILE_SIZE=$(stat -c%s "$APK_FILE")
          echo "APK File Size: $FILE_SIZE bytes"
          cp "$APK_FILE" lyra-debug-universal.apk
          echo "apk_path=lyra-debug-universal.apk" >> $GITHUB_OUTPUT
          echo "apk_size=$FILE_SIZE" >> $GITHUB_OUTPUT

      - name: Upload Debug APK to Telegram (Topic 146)
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          BUILD_DATE=$(date -u +'%Y-%m-%d %H:%M UTC')
          CAPTION="📦 <b>Lyra Music Debug APK</b>%0A%0A🔖 <b>Commit:</b> <code>$SHORT_SHA</code>%0A🌿 <b>Branch:</b> <code>${{ github.ref_name }}</code>%0A📅 <b>Build Date:</b> $BUILD_DATE"
          
          echo "Uploading APK to Topic 146..."
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendDocument" \
            -F "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -F "message_thread_id=${{ secrets.TOPIC_DEBUG_APK }}" \
            -F "document=@lyra-debug-universal.apk" \
            -F "caption=$CAPTION" \
            -F "parse_mode=HTML"

      - name: Publish to GitHub Release (Nightly)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: Lyra Music Debug (Nightly)
          prerelease: true
          files: lyra-debug-universal.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Notify Success (Topic 135)
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TOPIC_ID: ${{ secrets.TOPIC_GITHUB_LOGS }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          SERVER_URL: ${{ github.server_url }}
          REPO: ${{ github.repository }}
        run: |
          python3 -c '
          import os, json, urllib.request
          bot = os.environ.get("TELEGRAM_BOT_TOKEN")
          chat = os.environ.get("TELEGRAM_CHAT_ID")
          topic = os.environ.get("TOPIC_ID")
          sha = os.environ.get("SHA", "")[:7]
          run_id = os.environ.get("RUN_ID", "")
          server = os.environ.get("SERVER_URL", "https://github.com")
          repo = os.environ.get("REPO", "")
          text = f"✅ <b>Debug Build Succeeded!</b>\n\n📦 <b>APK delivered to Topic 146</b>\n🔖 <b>Commit:</b> <code>{sha}</code>\n🔗 <a href=\"{server}/{repo}/actions/runs/{run_id}\">View Workflow Run</a>"
          payload = json.dumps({"chat_id": int(chat), "message_thread_id": int(topic), "text": text, "parse_mode": "HTML", "disable_web_page_preview": True}).encode("utf-8")
          req = urllib.request.Request(f"https://api.telegram.org/bot{bot}/sendMessage", data=payload, headers={"Content-Type": "application/json"})
          try:
              urllib.request.urlopen(req, timeout=10)
          except Exception as e:
              print("Notify error:", e)
          ' || true

      - name: Notify Failure (Topic 135)
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TOPIC_ID: ${{ secrets.TOPIC_GITHUB_LOGS }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          SERVER_URL: ${{ github.server_url }}
          REPO: ${{ github.repository }}
        run: |
          python3 -c '
          import os, json, urllib.request, html
          bot = os.environ.get("TELEGRAM_BOT_TOKEN")
          chat = os.environ.get("TELEGRAM_CHAT_ID")
          topic = os.environ.get("TOPIC_ID")
          ref = html.escape(os.environ.get("REF_NAME", ""))
          sha = os.environ.get("SHA", "")[:7]
          run_id = os.environ.get("RUN_ID", "")
          server = os.environ.get("SERVER_URL", "https://github.com")
          repo = os.environ.get("REPO", "")
          text = f"❌ <b>Debug Build Failed!</b>\n\n🌿 <b>Branch:</b> <code>{ref}</code>\n🔖 <b>Commit:</b> <code>{sha}</code>\n🔗 <a href=\"{server}/{repo}/actions/runs/{run_id}\">Check Error Logs</a>"
          payload = json.dumps({"chat_id": int(chat), "message_thread_id": int(topic), "text": text, "parse_mode": "HTML", "disable_web_page_preview": True}).encode("utf-8")
          req = urllib.request.Request(f"https://api.telegram.org/bot{bot}/sendMessage", data=payload, headers={"Content-Type": "application/json"})
          try:
              urllib.request.urlopen(req, timeout=10)
          except Exception as e:
              print("Notify error:", e)
          ' || true