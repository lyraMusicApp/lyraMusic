name: Nightly Universal APK

on:
  push:
    branches:
      - lyra
      - master
    paths-ignore:
      - '*.md'
  workflow_dispatch:

concurrency:
  group: nightly-build
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - run: chmod +x gradlew

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: List outputs
        run: ls -R app/build/outputs/apk/

      - name: Get APK
        run: |
          APK_PATH=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          echo "APK found at: $APK_PATH"
          cp "$APK_PATH" app-nightly-universal.apk

      - name: Upload Nightly
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: Nightly Build (Universal)
          prerelease: true
          files: app-nightly-universal.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
